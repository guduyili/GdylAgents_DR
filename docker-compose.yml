services:

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: deepresearch_backend
    restart: unless-stopped
    env_file:
      - ./backend/src/.env
    environment:
      NOTES_WORKSPACE: /app/src/note
      RUN_STORE_BACKEND: sqlite
      RUN_STORE_DB_PATH: /app/src/data/research_runs.sqlite3
      SKILLS_WORKSPACE: /app/src/skills
      RESEARCH_MODE: deep
      ENABLE_FACT_CHECK: "true"
      ENABLE_REPORT_REVIEW: "true"
      RESEARCH_PIPELINE: plan,search,summarize,fact_check,report,review
      ENABLE_BROWSER_FETCH: "false"
      MAX_CONCURRENT_TASKS: "4"
      SEARCH_TIMEOUT_SECONDS: "60"
      SUMMARY_TIMEOUT_SECONDS: "120"
      SEARCH_FALLBACK_CHAIN: duckduckgo,tavily
    volumes:
      - notes_data:/app/src/note
      - run_store_data:/app/src/data
      - ./backend/skills:/app/src/skills:ro
    networks:
      - internal
    # 不对外暴露端口，仅通过 nginx 反代访问
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: deepresearch_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

volumes:
  notes_data:
    driver: local
  run_store_data:
    driver: local

networks:
  internal:
    driver: bridge
